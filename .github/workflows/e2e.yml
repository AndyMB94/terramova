# Recorridos públicos con Playwright contra el build de producción del frontend.
# La API se simula con page.route y datos ficticios: sin backend ni servicios externos.
name: e2e

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/e2e.yml"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias (lockfile)
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium y sus dependencias del sistema
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright (escritorio, tableta y móvil)
        run: pnpm exec playwright test

      - name: Informe y trazas si algo falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
