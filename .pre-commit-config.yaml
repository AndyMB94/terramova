# Ejecutar con `make precommit`; `make setup` instala el hook de git.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: (^|/)(pnpm-lock\.yaml|uv\.lock)$

  - repo: local
    hooks:
      - id: prettier-frontend
        name: prettier (frontend)
        language: system
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown
        files: ^frontend/
        # El hook corre desde la raíz y no aplica frontend/.prettierignore: se excluye aquí
        # lo generado (los tipos de la API los produce openapi-typescript tal cual).
        exclude: ^frontend/(pnpm-lock\.yaml|src/shared/api/schema\.d\.ts)$
