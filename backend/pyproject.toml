[project]
name = "terramova-backend"
version = "0.0.0"
description = "API de TerraMova: eventos sísmicos públicos, analítica y resúmenes controlados."
requires-python = ">=3.13,<3.14"
dependencies = [
    "django==5.2.18",
    "django-environ==0.14.0",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "gunicorn==26.2.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "redis==8.1.0",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]==6.1.2",
    "djangorestframework-stubs==3.18.1",
    "factory-boy==3.3.3",
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.17.1",
]

[tool.uv]
package = false

# --- ruff ---
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "DJ", "RUF", "BLE"]
# Django declara Meta, admin y choices como atributos de clase mutables por diseño.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"conftest.py" = ["S101"]
"config/settings/*.py" = ["F403", "F405"]

# --- mypy ---
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main", "pydantic.mypy"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["environ", "environ.*"]
ignore_missing_imports = true

# factory_boy trae tipos parciales: se aceptan sus reexportaciones y sus llamadas sin
# anotar, solo en el código de pruebas.
[[tool.mypy.overrides]]
module = ["factory", "factory.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["*.tests.*"]
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

# --- pytest ---
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--strict-markers --strict-config -ra"
testpaths = ["core", "config", "apps", "integrations"]
markers = [
    "integration: usa PostgreSQL y Redis reales (levantados con `make up` o servicios de CI)",
]

# --- import-linter: reglas de dependencia de docs/STRUCTURE.md ---
[tool.importlinter]
root_packages = ["config", "core", "apps", "integrations"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core es transversal: no depende de config, apps ni integrations (regla 5)"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["config", "apps", "integrations"]

[[tool.importlinter.contracts]]
name = "integrations solo conoce los ports de las apps (regla 3)"
type = "forbidden"
source_modules = ["integrations"]
forbidden_modules = ["apps"]
ignore_imports = ["integrations.** -> apps.earthquakes.ports"]

[[tool.importlinter.contracts]]
# import-linter no admite prohibir solo django.db: se prohíbe Django entero, más estricto.
name = "integrations nunca toca el ORM ni Django (regla 3)"
type = "forbidden"
source_modules = ["integrations"]
forbidden_modules = ["django"]

[[tool.importlinter.contracts]]
name = "capas de earthquakes: api|comando > servicios > selectors > modelos > dominio|ports (reglas 1-2)"
type = "layers"
layers = [
    "apps.earthquakes.api | apps.earthquakes.management",
    "apps.earthquakes.services",
    "apps.earthquakes.selectors",
    "apps.earthquakes.models",
    "apps.earthquakes.domain | apps.earthquakes.ports",
]

[[tool.importlinter.contracts]]
name = "servicios, selectors y modelos dependen de ports, no de adapters (regla 2)"
type = "forbidden"
source_modules = [
    "apps.earthquakes.api",
    "apps.earthquakes.services",
    "apps.earthquakes.selectors",
    "apps.earthquakes.models",
    "apps.earthquakes.domain",
]
forbidden_modules = ["integrations"]

[[tool.importlinter.contracts]]
name = "la API pública no llega a los servicios de escritura (regla 1)"
type = "forbidden"
source_modules = ["apps.earthquakes.api"]
forbidden_modules = ["apps.earthquakes.services"]

[[tool.importlinter.contracts]]
name = "capas de analytics: api > servicios > selectors > dominio (reglas 1-2)"
type = "layers"
layers = [
    "apps.analytics.api",
    "apps.analytics.services",
    "apps.analytics.selectors",
    "apps.analytics.domain",
]

[[tool.importlinter.contracts]]
# Regla 4 (D99): de earthquakes, analytics solo usa selectors, dominio y, en su API, el
# parser público de filtros. Nunca modelos, servicios de escritura, comandos ni vistas.
name = "analytics solo lee earthquakes por su interfaz pública (regla 4)"
type = "forbidden"
source_modules = ["apps.analytics"]
forbidden_modules = [
    "apps.earthquakes.models",
    "apps.earthquakes.services",
    "apps.earthquakes.management",
    "apps.earthquakes.api.views",
    "apps.earthquakes.api.serializers",
    "integrations",
]
# selectors de earthquakes usa sus modelos por dentro: eso es suyo, no de analytics.
allow_indirect_imports = true
# Las pruebas preparan datos con los modelos y factories de earthquakes.
ignore_imports = ["apps.analytics.tests.** -> apps.earthquakes.**"]

[[tool.importlinter.contracts]]
name = "solo la API de analytics usa el parser de filtros de earthquakes (regla 4)"
type = "forbidden"
source_modules = ["apps.analytics.services", "apps.analytics.selectors", "apps.analytics.domain"]
forbidden_modules = ["apps.earthquakes.api"]

[[tool.importlinter.contracts]]
name = "earthquakes no conoce analytics"
type = "forbidden"
source_modules = ["apps.earthquakes"]
forbidden_modules = ["apps.analytics"]
