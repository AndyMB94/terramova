# Sitio de TerraMova en el Nginx del HOST del VPS (docs/DEPLOYMENT.md).
# Se instala como /etc/nginx/sites-available/terramova.andymallcco.dev y se enlaza en
# sites-enabled. No toca los sitios de Vacantia ni del portafolio. Certbot añade después
# las líneas del certificado y la redirección 80→443 (`certbot --nginx -d ...`).
#
# Antes de recargar: sudo nginx -t. Preparado y probado en local (Fase 6, PR 1); aún no
# instalado en el VPS.

# --- Contexto http (sites-enabled se incluye dentro de http {}) ---
proxy_cache_path /var/cache/nginx/terramova levels=1:2 keys_zone=terramova_api:10m
                 max_size=200m inactive=10m use_temp_path=off;
limit_req_zone $binary_remote_addr zone=terramova_req:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name terramova.andymallcco.dev;

    root /var/www/terramova;
    index index.html;
    client_max_body_size 1m;
    server_tokens off;

    # Cabeceras de seguridad para el frontend. La CSP está ajustada a lo que usa la app
    # (probada en un navegador a través de este Nginx, D114): Cesium crea workers desde
    # blob:, compila WebAssembly ('wasm-unsafe-eval' permite solo eso, no eval de
    # JavaScript) y pinta con estilos en línea; todo lo demás es del mismo origen
    # (teselas, fronteras, API). Nada de terceros.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json text/css application/javascript image/svg+xml;

    # --- API pública: límite por IP, microcaché y cabeceras del proxy ---
    location /api/ {
        limit_req zone=terramova_req burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # sobrescribe: no concatena lo que envía el cliente
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 15s;

        proxy_cache terramova_api;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health/live/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /health/ready/ no se expone: detalla dependencias internas.

    # --- Admin: además del login de Django, contraseña de Nginx (htpasswd fuera de Git).
    # __ADMIN_PATH__ se sustituye al instalar por el valor de DJANGO_ADMIN_URL.
    location /__ADMIN_PATH__ {
        auth_basic "TerraMova admin";
        auth_basic_user_file /etc/nginx/terramova.htpasswd;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
    # Estáticos del admin (WhiteNoise en Gunicorn).
    location /static/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend estático ---
    # Archivos con hash: inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Recursos del globo (Cesium, teselas, fronteras): cambian solo al redesplegar.
    location ~ ^/(cesium|imagery|geo)/ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Rutas de la SPA (/analitica, /acerca…): index.html sin caché para recoger versiones nuevas.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }
}
